<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - Làn Mây POS</title>
  <link rel="icon" href="/assets/logo.svg">
  <!-- Dùng chung màu, nút, ô nhập của cả app (khung giao diện H1) -->
  <link rel="stylesheet" href="/css/app.css">
  <style>
    /* Căn thẻ đăng nhập giữa màn hình */
    body {
      background: var(--nen);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .the-dang-nhap {
      width: 100%;
      max-width: 24rem;
      background: #fff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(43, 27, 18, .08);
    }

    .the-dang-nhap .logo {
      width: 3rem;
      height: 3rem;
      margin: 0 auto .75rem;
    }

    .the-dang-nhap h1 {
      text-align: center;
      font-size: 1.3rem;
      margin: 0 0 1.25rem;
    }

    /* Ô mật khẩu có nút "Hiện/Ẩn" nằm đè ở mép phải, nên chừa chỗ bên phải cho chữ */
    .o-mat-khau {
      position: relative;
    }

    .o-mat-khau input {
      padding-right: 4.5rem;
    }

    .nut-hien {
      position: absolute;
      right: .3rem;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: var(--brand);
      font-weight: 700;
      cursor: pointer;
      min-height: 2.25rem;
      padding: 0 .5rem;
    }

    .ghi-nho {
      display: flex;
      gap: .5rem;
      align-items: center;
      margin-bottom: 1rem;
      font-size: .95rem;
      min-height: 2.75rem;
    }

    .ghi-nho input {
      width: 1.2rem;
      height: 1.2rem;
    }

    .quen {
      display: block;
      margin: .75rem auto 0;
      background: none;
      border: none;
      color: var(--brand);
      text-decoration: underline;
      cursor: pointer;
      min-height: 2.75rem;
    }
  </style>
</head>
<body>
  <main class="the-dang-nhap">
    <img class="logo" src="/assets/logo.svg" alt="">
    <h1>Đăng nhập Làn Mây POS</h1>

    <!-- Lỗi chung (sai thông tin, tài khoản bị khóa...) hiện ở đây; dang-nhap.js bật/tắt class "an" -->
    <p class="hop-loi an" id="hop-loi" role="alert"></p>

    <form id="form-dang-nhap" novalidate>
      <div class="truong">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" name="username" autocomplete="username" aria-describedby="loi-username" autofocus>
        <p class="loi-o" id="loi-username"></p>
      </div>

      <div class="truong">
        <label for="password">Mật khẩu</label>
        <div class="o-mat-khau">
          <input type="password" id="password" name="password" autocomplete="current-password" aria-describedby="loi-password">
          <button type="button" class="nut-hien" id="nut-hien" aria-controls="password" aria-pressed="false">Hiện</button>
        </div>
        <p class="loi-o" id="loi-password"></p>
      </div>

      <label class="ghi-nho"><input type="checkbox" id="ghi-nho"> Ghi nhớ đăng nhập</label>
      <button class="btn btn-chinh btn-rong" type="submit" id="nut-dang-nhap">Đăng nhập</button>
    </form>
    <button type="button" class="quen" id="nut-quen">Quên mật khẩu?</button>
  </main>

  <!-- Thứ tự nạp: ui.js (thông báo) -> phien.js (đăng nhập) -> api.js (gọi server) -> code riêng của trang -->
  <script src="/js/ui.js"></script>
  <script src="/js/phien.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/dang-nhap.js"></script>
</body>
</html>
